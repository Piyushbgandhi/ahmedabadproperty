
version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - DATABASE=ahmedabad_property_production
    depends_on:
      - mongo
      - redis
  
  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  
  redis:
    image: redis:7.0
    ports:
      - "6379:6379"

volumes:
  mongo_data:

  